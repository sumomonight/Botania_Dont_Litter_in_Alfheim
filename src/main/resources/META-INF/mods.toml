modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
credits="Botania by Vazkii (Botania License)"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Required: Botania
[[dependencies.${mod_id}]]
modId="botania"
mandatory=true
versionRange="[1.20.1-440,)"
ordering="AFTER"
side="BOTH"

# Optional: MythicBotany
[[dependencies.${mod_id}]]
modId="mythicbotany"
mandatory=false
versionRange="[1.20.1-4.0.0,)"
ordering="AFTER"
side="BOTH"

# Optional: JEI
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15.2.0.27,)"
ordering="NONE"
side="CLIENT"

# Required: Wave Text Lib
[[dependencies.dont_litter_in_alfheim]]
modId="watelib"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"